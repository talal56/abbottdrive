$kind: http-request
name: "{{baseUrl}}/api/auth/signup"
description: ""
url: "{{baseUrl}}/api/auth/signup"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Test Rider\",\r

    \  \"phone\": \"03001234567\",\r

    \  \"password\": \"password123\"\r

